name: Auto-Refresh Quantum Events Feed

on:
  schedule:
    # Runs every Monday at 00:00 UTC (08:00 AM Singapore Time)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  refresh-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest Latest Quantum Events & Industry Feeds
        run: python scripts/fetch_quantum_events.py

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "QShift Lab Bot"
          git config --global user.email "bot@qshiftlab.com"
          git add data/events.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update live quantum events feed [skip ci]" && git push)

